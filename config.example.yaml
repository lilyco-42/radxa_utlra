# Radxa connection used by scripts/radxa-ctl.*
radxa_host: lain42.top
radxa_user: root
radxa_key: ~/.ssh/lain42.pem
radxa_port: 22

# Video pipeline settings used by `python -m video_tool`
input_dir: ~/Videos/raw
output_dir: ~/Videos/edited
done_dir: ~/Videos/done
extensions:
  - .mp4
  - .mkv
  - .mov
  - .webm
  - .m4v
  - .avi
  - .jpg
  - .jpeg
  - .png
  - .webp

width: 1080
height: 1920
fps: 30
crf: 23
# preset: A733 (Allwinner) 纯软编, veryfast 比默认 medium 快 ~43% 且产物更小;
# medium 仅 1.11x 实时, 几乎卡在临界点。无硬编卡时推荐 veryfast。
preset: veryfast
image_duration: 3.0

# Optional overlay image, e.g. ~/Pictures/watermark.png
watermark: ""

# off, srt, or burn
captions: srt
whisper_model: small
whisper_language: null
whisper_device: cpu
whisper_compute_type: int8

# Upload targets:
#   rclone:remote:path
#   gh:owner/repo:tag
#   cp:/path/to/upload/folder
#   https://example.com/upload
upload_targets: []

keep_raw: true
interval: 10

# 可选资源协调闸门: 非空时, watch 每轮处理前执行该命令。
# 退出码 0 = 放行, 非 0 = 暂停(例如 MC 有玩家在线时把 CPU 让出来)。
# 配合 scripts/mc-gate.sh 使用: 当 MC 在线人数 > 0 时暂停视频处理。
# 命令异常/不存在时稳妥放行, 不会把整条流水线卡死。
gate_command: ""
