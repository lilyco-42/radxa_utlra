name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Create venv and install (no heavy deps)
        run: |
          uv venv
          # 测试是纯 Python, 不需要 ffmpeg / faster-whisper, 只装包本身 + PyYAML
          uv pip install -e . --no-deps
          uv pip install PyYAML

      - name: Run tests with uv
        run: uv run python -m unittest discover -s tests -v
